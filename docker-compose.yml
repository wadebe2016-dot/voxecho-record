name: voxecho-record

services:
  db:
    image: postgres:16-alpine
    container_name: voxecho-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxecho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-voxecho}
      TZ: ${TZ:-Africa/Douala}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-voxecho} -d ${POSTGRES_DB:-voxecho}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
