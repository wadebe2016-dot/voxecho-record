server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Un enregistreur de conformité n'a rien à faire dans un index public.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # Le portail et l'api partagent l'origine : pas de CORS, pas de jeton qui
  # traverse un domaine tiers.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # La réécoute streamée (S3) s'appuie sur les requêtes Range.
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Application monopage : toute route inconnue rend index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
