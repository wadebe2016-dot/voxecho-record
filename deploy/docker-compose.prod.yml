# Composition de l'instance de démonstration — CLAUDE.md §9.18.
#
# Le livrable du §2 ne change pas : api, portail servi par nginx, PostgreSQL.
# Caddy s'ajoute **devant**, il ne remplace rien — la chaîne devient
# Caddy → nginx → api, et c'est la même image qu'un client installerait chez
# lui. Seuls 80 et 443 sont publiés : ni la base, ni l'api ne sont joignables
# autrement que par le portail.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d

name: voxecho-record

# Environnement partagé par l'api et les outils d'exploitation qui tournent
# depuis la même image (seed, sauvegarde) : ils doivent voir exactement la même
# base, le même stockage et la même clé, sinon ils travailleraient à côté.
x-api-env: &api-env
  NODE_ENV: production
  TZ: Africa/Douala
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
  API_PORT: 3000
  CORS_ORIGINS: https://record.voxecho.cm
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  API_BEHIND_TLS: 'true'
  STORAGE_ENCRYPTION_ENABLED: 'true'
  STORAGE_MASTER_KEY: ${STORAGE_MASTER_KEY}
  STORAGE_KEY_REF: ${STORAGE_KEY_REF:-k1}
  INGEST_DIR: /data/ingest
  STORAGE_DIR: /data/storage
  QUARANTINE_DIR: /data/quarantine
  BACKUP_DIR: /backups
  INGEST_POLL_ENABLED: 'true'
  INGEST_POLL_MS: 5000
  INSTANCE_DEMO: ${INSTANCE_DEMO:-true}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/wadebe2016-dot/voxecho-record-api:${VOXECHO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Les commentaires de chacune de ces variables sont au-dessus, sur
    # `x-api-env` : c'est le même environnement pour l'api et ses outils.
    environment: *api-env
    volumes:
      - audio-data:/data
      - backup-data:/backups
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

  # Outil de garnissage, lancé à la demande et jamais au démarrage :
  #   docker compose --profile outils run --rm seed
  #
  # Il porte les mots de passe des comptes de démonstration, qui n'ont donc
  # aucune raison de vivre en permanence dans l'environnement de l'api. Son
  # point d'entrée court-circuite les migrations : l'api les a déjà appliquées.
  seed:
    profiles: ['outils']
    image: ghcr.io/wadebe2016-dot/voxecho-record-api:${VOXECHO_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-env
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@demo.voxecho.cm}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_AUDITOR_EMAIL: ${DEMO_AUDITOR_EMAIL:-auditeur@demo.voxecho.cm}
      DEMO_AUDITOR_PASSWORD: ${DEMO_AUDITOR_PASSWORD}
      DEMO_SUPERVISOR_EMAIL: ${DEMO_SUPERVISOR_EMAIL:-superviseur@demo.voxecho.cm}
      DEMO_SUPERVISOR_PASSWORD: ${DEMO_SUPERVISOR_PASSWORD}
    volumes:
      - audio-data:/data
      - backup-data:/backups
    entrypoint: ['node']
    command: ['apps/api/dist/demo/seed-demo.js']

  web:
    image: ghcr.io/wadebe2016-dot/voxecho-record-web:${VOXECHO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats survivent au conteneur : sans ce volume, chaque
      # redémarrage redemanderait un certificat et finirait par buter sur les
      # quotas de Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

volumes:
  db-data:
  audio-data:
  backup-data:
  caddy-data:
  caddy-config:
  caddy-logs:
