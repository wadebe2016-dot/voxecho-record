# Composition de l'instance de démonstration — CLAUDE.md §9.18.
#
# Le livrable du §2 ne change pas : api, portail servi par nginx, PostgreSQL.
# Caddy s'ajoute **devant**, il ne remplace rien — la chaîne devient
# Caddy → nginx → api, et c'est la même image qu'un client installerait chez
# lui. Seuls 80 et 443 sont publiés : ni la base, ni l'api ne sont joignables
# autrement que par le portail.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d

name: voxecho-record

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/wadebe2016-dot/voxecho-record-api:${VOXECHO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Africa/Douala
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      API_PORT: 3000
      # Portail et api partagent l'origine : aucune origine tierce autorisée.
      CORS_ORIGINS: https://record.voxecho.cm
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Caddy puis nginx relaient : sans cette déclaration, toutes les entrées
      # du journal d'audit porteraient l'adresse d'un conteneur (§9.16).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      # Caddy termine le TLS : l'api peut promettre HSTS sans mentir.
      API_BEHIND_TLS: 'true'
      # Le chiffrement au repos est actif : c'est le produit tel qu'il sera
      # livré, et le scénario de contrôle se joue chiffré (§9.13). La clé
      # maître ne vit pas dans le dépôt et doit être sauvegardée AILLEURS —
      # une base restaurée sans elle ne rend rien (§9.14).
      STORAGE_ENCRYPTION_ENABLED: 'true'
      STORAGE_MASTER_KEY: ${STORAGE_MASTER_KEY}
      STORAGE_KEY_REF: ${STORAGE_KEY_REF:-k1}
      INGEST_DIR: /data/ingest
      STORAGE_DIR: /data/storage
      QUARANTINE_DIR: /data/quarantine
      # Volume distinct des preuves : une sauvegarde rangée sur le disque
      # qu'elle protège ne protège de rien.
      BACKUP_DIR: /backups
      INGEST_POLL_ENABLED: 'true'
      INGEST_POLL_MS: 5000
      # Instance de démonstration : le portail le dit à qui s'y connecte,
      # plutôt que de laisser croire à de vraies conversations de clients.
      INSTANCE_DEMO: ${INSTANCE_DEMO:-true}
    volumes:
      - audio-data:/data
      - backup-data:/backups
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/wadebe2016-dot/voxecho-record-web:${VOXECHO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats survivent au conteneur : sans ce volume, chaque
      # redémarrage redemanderait un certificat et finirait par buter sur les
      # quotas de Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

volumes:
  db-data:
  audio-data:
  backup-data:
  caddy-data:
  caddy-config:
  caddy-logs:
