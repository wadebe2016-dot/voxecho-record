# Composition de l'instance d'évaluation — CLAUDE.md §9.18 et §9.21.
#
# Le livrable du §2 ne change pas : api, portail servi par nginx, PostgreSQL.
# Caddy s'ajoute **devant**, il ne remplace rien — la chaîne devient
# Caddy → nginx → api, et c'est la même image qu'un client installerait chez
# lui. Seuls 80 et 443 sont publiés : ni la base, ni l'api ne sont joignables
# autrement que par le portail.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d

name: voxecho-record

# Environnement partagé par l'api et les outils d'exploitation qui tournent
# depuis la même image (seed, sauvegarde) : ils doivent voir exactement la même
# base, le même stockage et la même clé, sinon ils travailleraient à côté.
x-api-env: &api-env
  NODE_ENV: production
  TZ: Africa/Douala
  # Mode de déploiement (§9.36) : masque les sections de réglages qui n'ont de
  # sens que sur un boîtier installé chez le client.
  VOXECHO_DEPLOY_MODE: ${VOXECHO_DEPLOY_MODE:-cloud}
  # Relevé d'horloge, écrit par le conteneur `horloge` ci-dessous. L'api le lit
  # et ignore qui l'écrit : son absence donne « indisponible », jamais
  # « non synchronisé ».
  CHRONY_ETAT_FICHIER: /etat/horloge.csv
  # Composants, jamais l'URL assemblée : un mot de passe tiré au hasard
  # contient tôt ou tard `/` ou `+`, et une URL concaténée sans encodage se
  # termine en « invalid port number » (§9.19). Le produit la construit.
  POSTGRES_HOST: db
  POSTGRES_PORT: '5432'
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  API_PORT: 3000
  CORS_ORIGINS: https://record.voxecho.cm
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  API_BEHIND_TLS: 'true'
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
  RETENTION_REGULATORY_FLOORS: ${RETENTION_REGULATORY_FLOORS:-}
  STORAGE_ENCRYPTION_ENABLED: 'true'
  STORAGE_MASTER_KEY: ${STORAGE_MASTER_KEY}
  STORAGE_KEY_REF: ${STORAGE_KEY_REF:-k1}
  INGEST_DIR: /data/ingest
  STORAGE_DIR: /data/storage
  QUARANTINE_DIR: /data/quarantine
  BACKUP_DIR: /backups
  INGEST_POLL_ENABLED: 'true'
  INGEST_POLL_MS: 5000
  # Version d'évaluation : le portail le dit à qui s'y connecte, plutôt que de
  # laisser croire à de vraies conversations de clients (§9.21).
  INSTANCE_EVALUATION: ${INSTANCE_EVALUATION:-true}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/wadebe2016-dot/voxecho-record-api:${VOXECHO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Les commentaires de chacune de ces variables sont au-dessus, sur
    # `x-api-env` : c'est le même environnement pour l'api et ses outils.
    environment: *api-env
    volumes:
      - audio-data:/data
      - backup-data:/backups
      - horloge-etat:/etat:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

  # Relevé de l'horloge de l'hôte — CLAUDE.md §9.36.
  #
  # L'api ne peut pas interroger chronyd elle-même : son socket de commande est
  # un socket datagramme unix, que Node n'ouvre pas. Ce conteneur partage le
  # réseau de l'hôte, interroge le démon sur son port de commande local, et
  # dépose la sortie brute de `chronyc -c tracking` dans un volume que l'api lit.
  #
  # Il n'écrit rien d'autre et ne règle rien : c'est un relevé, pas un agent.
  # Si on le retire, l'écran dit « état indisponible » — jamais « synchronisé ».
  horloge:
    image: alpine:3.20
    restart: unless-stopped
    network_mode: host
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache chrony >/dev/null 2>&1 || true
        while true; do
          chronyc -c -h 127.0.0.1 tracking > /etat/horloge.csv.tmp 2>/dev/null             && mv /etat/horloge.csv.tmp /etat/horloge.csv
          sleep 30
        done
    volumes:
      - horloge-etat:/etat

  # Outil de garnissage, lancé à la demande et jamais au démarrage :
  #   docker compose --profile outils run --rm seed
  #
  # Il porte les mots de passe des comptes d'évaluation, qui n'ont donc aucune
  # raison de vivre en permanence dans l'environnement de l'api. Son point
  # d'entrée court-circuite les migrations : l'api les a déjà appliquées.
  seed:
    profiles: ['outils']
    image: ghcr.io/wadebe2016-dot/voxecho-record-api:${VOXECHO_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-env
      EVAL_ADMIN_EMAIL: ${EVAL_ADMIN_EMAIL:-admin@banque-meridienne.cm}
      EVAL_ADMIN_PASSWORD: ${EVAL_ADMIN_PASSWORD}
      EVAL_AUDITOR_EMAIL: ${EVAL_AUDITOR_EMAIL:-auditeur@banque-meridienne.cm}
      EVAL_AUDITOR_PASSWORD: ${EVAL_AUDITOR_PASSWORD}
      EVAL_SUPERVISOR_EMAIL: ${EVAL_SUPERVISOR_EMAIL:-superviseur@banque-meridienne.cm}
      EVAL_SUPERVISOR_PASSWORD: ${EVAL_SUPERVISOR_PASSWORD}
    volumes:
      - audio-data:/data
      - backup-data:/backups
    entrypoint: ['node']
    command: ['apps/api/dist/evaluation/seed-evaluation.js']

  web:
    image: ghcr.io/wadebe2016-dot/voxecho-record-web:${VOXECHO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats survivent au conteneur : sans ce volume, chaque
      # redémarrage redemanderait un certificat et finirait par buter sur les
      # quotas de Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

volumes:
  horloge-etat:
  db-data:
  audio-data:
  backup-data:
  caddy-data:
  caddy-config:
  caddy-logs:
